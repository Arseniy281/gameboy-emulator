<!doctype html><html lang="en"><meta charset="utf-8"><title>Game Boy display</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#26352a}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}</style><canvas width="160" height="144" aria-label="Game screen"></canvas><script src="/gb-core.js"></script><script>let engine;const fail=()=>parent.postMessage({type:'game-error'},location.origin);onerror=fail;onmessage=e=>{if(e.origin!==location.origin||e.source!==parent)return;try{if(e.data.rom){engine=new gameboy.Gameboy();engine.loadGame(e.data.rom);const ctx=document.querySelector('canvas').getContext('2d');engine.onFrameFinished(frame=>ctx.putImageData(frame,0,0));engine.run()}else if(engine&&['Up','Down','Left','Right','Start','Select','A','B'].includes(e.data.key)){engine.input['isPressing'+e.data.key]=e.data.down}}catch{fail()}}</script></html>
